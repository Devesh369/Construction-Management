[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "migrations",
    "venv",
    ".venv"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
