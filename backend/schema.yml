      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: employee
        schema:
          type: integer
      - in: query
        name: is_locked
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ABSENT
          - HALF_DAY
          - HOLIDAY
          - PRESENT
        description: |-
          * `PRESENT` - Present
          * `HALF_DAY` - Half Day
          * `ABSENT` - Absent
          * `HOLIDAY` - Holiday
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
