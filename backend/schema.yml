components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
        is_active:
          type: boolean
      required:
      - code
      - id
      - name
      - type
    AccountRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 10
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
        is_active:
          type: boolean
      required:
      - code
      - name
      - type
    Advance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
        employee_code:
          type: string
          readOnly: true
        employee_name:
          type: string
          readOnly: true
        project:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        advance_date:
          type: string
          format: date
        reason:
          type: string
        payment_mode:
          type: string
          maxLength: 20
        given_by:
          type: integer
          readOnly: true
        given_by_name:
          type: string
          readOnly: true
        adjusted_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        remaining_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AdvanceStatusEnum'
          readOnly: true
        journal_entry:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - adjusted_amount
      - advance_date
      - amount
      - created_at
      - employee
      - employee_code
      - employee_name
      - given_by
      - given_by_name
      - id
      - journal_entry
      - project
      - remaining_amount
      - status
      - updated_at
