openapi: 3.0.3
info:
  title: Construction Management Portal API
  version: 1.0.0
  description: Multi-tenant SaaS platform for construction companies. Provides project
    management, GPS-verified attendance, DPR, expenses, payroll calculation, double-entry
    ledger, and audit tracking.
paths:
  /api/v1/advances:
    get:
      operationId: advances_list
      description: 'UC-23: Worker cash advances and asset tracking.'
      parameters:
      - in: query
        name: employee
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_mode
        schema:
          type: string
      - in: query
        name: project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ADJUSTED
          - OPEN
          - PARTIALLY_ADJUSTED
        description: |-
          * `OPEN` - Open
          * `PARTIALLY_ADJUSTED` - Partially Adjusted
          * `ADJUSTED` - Adjusted
      tags:
      - advances
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdvanceList'
          description: ''
    post:
      operationId: advances_create
      description: Record a cash advance given to a worker.
      tags:
      - advances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdvanceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdvanceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advance'
          description: ''
  /api/v1/advances/{id}:
    get:
      operationId: advances_retrieve
      description: 'UC-23: Worker cash advances and asset tracking.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this advance.
        required: true
      tags:
      - advances
      security:
